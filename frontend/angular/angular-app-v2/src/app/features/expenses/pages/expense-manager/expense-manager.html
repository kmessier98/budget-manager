<div class="expense-manager">
  <div class="expense-manager-content">
    <div class="top">
      <img [src]="avatar" alt="User Avatar" />
      <h1>Gestionnaire de dépenses</h1>
    </div>
    <hr />
    <div class="content">
      <app-expense-toolbar
        [filters]="filters()"
        (onFiltersChange)="handleFiltersChange($event)"
        [daysInMonth]="daysInMonth()"
      ></app-expense-toolbar>
      <hr />
      <div class="middle">
        <div class="left">
          <app-expense-total-amount></app-expense-total-amount>
          <app-expense-table
            [filters]="filters()"
            (onPageChange)="handlePageChange($event)"
          ></app-expense-table>
        </div>
        <div class="right">
          <app-expense-chart></app-expense-chart>
        </div>
      </div>
    </div>
  </div>
</div>

@if (categoryService.loading() || expenseService.loading()) {
  <div class="progress-overlay">
    <p-progressSpinner
      ariaLabel="loading"
      strokeWidth="5"
      animationDuration=".5s"
      class="progress-spinner"
    ></p-progressSpinner>
  </div>
}
