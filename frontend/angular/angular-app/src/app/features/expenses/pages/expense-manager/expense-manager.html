<div class="expense-manager">
  <div class="expense-manager-content">
    <div class="top">
      <img [src]="avatar" alt="User Avatar" />
      <h1>Gestionnaire de dépenses</h1>
    </div>
    <hr />
    <div class="content">
      <app-expense-toolbar
        [filters]="filters()"
        (onFiltersChange)="onFiltersChange($event)"
        [daysInMonth]="daysInMonth()"
      ></app-expense-toolbar>
      <!-- 
          <ExpenseToolbar
            filters={filters}
            daysInMonth={daysInMonth}
            categories={categoriesOptions}
            onFiltersChange={(newFilters: Filters) => setFilters(newFilters)}
            onAddExpenseSuccess={loadExpenses}
          />
        -->
      <hr />
      <div class="middle">
        <div class="left">
          <app-expense-total-amount></app-expense-total-amount>
          <app-expense-table></app-expense-table>
          <!--
          <!--
              {expense && <TotalAmount summaryExpense={expense.summary} />}
              {expense && (
                <ExpensesTable
                  expenseResponse={expense}
                  onDelete={handleDelete}
                  categories={categories}
                  onUpdateSuccess={() => {
                    handleUpdateSuccess();
                  }}
                  onPaginationChange={(newPagination) => {
                    setPagination({
                      pageNumber: newPagination.pageIndex + 1,
                      pageSize: newPagination.pageSize,
                    });
                  }}
                  pagination={{
                    pageIndex: pagination.pageNumber - 1,
                    pageSize: pagination.pageSize,
                  }}
                />
              )}
                -->
        </div>
        <div class="right">
          <app-expense-chart></app-expense-chart>
          <!--
              {expense && (
                <ExpenseChart data={expense.summary.amountByCategory} />
              )}
              -->
        </div>
      </div>
    </div>
  </div>
</div>

@if (categoryService.loading() || expenseService.loading()) {
  <div class="progress-overlay">
    <p-progressSpinner
      ariaLabel="loading"
      strokeWidth="5"
      animationDuration=".5s"
      class="progress-spinner"
    ></p-progressSpinner>
  </div>
}
