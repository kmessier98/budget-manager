<p-table
  [value]="transactions()"
  [paginator]="true"
  [lazy]="true"
  [first]="first()"
  [rows]="metadata()?.pageSize ?? 10"
  [rowsPerPageOptions]="[5, 10, 20, 30, 40, 50]"
  [showCurrentPageReport]="true"
  [totalRecords]="metadata()?.totalItems ?? 0"
  (onPage)="handlePageChange($event)"
  dropdownAppendTo="body"
>
  <ng-template pTemplate="header">
    <tr>
      <th>Date</th>
      <th>Catégorie</th>
      <th>Description</th>
      <th>Montant</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-transaction>
    <tr>
      <td>{{ transaction.date | date: 'dd MMMM yyyy' : '' : 'fr-CA' }}</td>
      <td>{{ transaction.category.name }}</td>
      <td>{{ transaction.description }}</td>
      <td class="amount">{{ transaction.amount | currency: 'CAD' : 'symbol' : '' : 'fr-CA' }}</td>
      <td>
        <div class="actions">
          <p-button icon="pi pi-pencil" class="" (onClick)="handleEdit(transaction)"></p-button>
          <p-button icon="pi pi-trash" class="" (onClick)="handleDelete(transaction)"></p-button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
@if (isEditModalOpen) {
  <app-expense-form-modal
    [expenseToEdit]="selectedExpense"
    [filters]="filters()"
    (onClose)="handleModalClose()"
    (onExpenseSaved)="handleSavedExpense()"
  ></app-expense-form-modal>
}
